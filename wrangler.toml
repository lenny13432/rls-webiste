# Real Life Southland – Cloudflare Worker mit statischen Seiten und D1-Datenbank
#
# WICHTIG: Trage unten bei database_id die ID deiner Datenbank "southland" ein.
# Zu finden in Cloudflare unter: Speicher & Datenbanken → D1 → southland → Datenbank-ID
#
# "name" muss genau so heißen wie dein Worker in Cloudflare.

name = "rls-website"
main = "src/worker.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "southland"
database_id = "90e2bf8f-45b1-45bf-9c55-6840de216efe"

[vars]
MIN_AGE = "16"
COOLDOWN_DAYS = "7"
DELETE_AFTER_DAYS = "90"
SITE_URL = "https://reallifesouthland.de"

[observability]
enabled = true
